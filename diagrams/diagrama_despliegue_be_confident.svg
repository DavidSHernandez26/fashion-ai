<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
  <defs>
    <style>
      .title{font:700 30px Arial, sans-serif;fill:#111827}
      .nodeTitle{font:700 18px Arial, sans-serif;fill:#0f172a}
      .label{font:16px Arial, sans-serif;fill:#111827}
      .small{font:14px Arial, sans-serif;fill:#475569}
      .outer{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:18}
      .node{fill:#ffffff;stroke:#2563eb;stroke-width:2;rx:14}
      .cloud{fill:#eef2ff;stroke:#4f46e5;stroke-width:2;rx:26}
      .artifact{fill:#ecfeff;stroke:#0891b2;stroke-width:2;rx:8}
      .service{fill:#f0fdf4;stroke:#16a34a;stroke-width:2;rx:8}
      .db{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:8}
      .line{stroke:#334155;stroke-width:2.2;fill:none}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="25" y="25" width="1550" height="900" class="outer"/>
  <text x="800" y="70" text-anchor="middle" class="title">Diagrama de despliegue - Be: Confident</text>

  <!-- Device -->
  <rect x="80" y="130" width="360" height="250" class="node"/>
  <text x="260" y="165" text-anchor="middle" class="nodeTitle">Dispositivo usuario</text>
  <rect x="125" y="205" width="270" height="54" class="artifact"/>
  <text x="260" y="238" text-anchor="middle" class="label">Web App React</text>
  <rect x="125" y="290" width="270" height="54" class="artifact"/>
  <text x="260" y="323" text-anchor="middle" class="label">App Android/iOS Capacitor</text>

  <!-- Hosting -->
  <rect x="80" y="520" width="360" height="180" class="node"/>
  <text x="260" y="555" text-anchor="middle" class="nodeTitle">Vercel / Hosting estático</text>
  <rect x="125" y="600" width="270" height="54" class="artifact"/>
  <text x="260" y="633" text-anchor="middle" class="label">Frontend build</text>

  <!-- Railway -->
  <rect x="620" y="300" width="360" height="190" class="node"/>
  <text x="800" y="335" text-anchor="middle" class="nodeTitle">Railway</text>
  <rect x="665" y="385" width="270" height="54" class="service"/>
  <text x="800" y="418" text-anchor="middle" class="label">Node.js Express API</text>

  <!-- Supabase -->
  <rect x="1160" y="115" width="360" height="300" class="cloud"/>
  <text x="1340" y="152" text-anchor="middle" class="nodeTitle">Supabase</text>
  <rect x="1210" y="195" width="260" height="54" class="db"/>
  <text x="1340" y="228" text-anchor="middle" class="label">PostgreSQL</text>
  <rect x="1210" y="270" width="260" height="54" class="db"/>
  <text x="1340" y="303" text-anchor="middle" class="label">Storage bucket prendas</text>
  <rect x="1210" y="345" width="260" height="44" class="service"/>
  <text x="1340" y="373" text-anchor="middle" class="label">Auth</text>

  <!-- OpenAI -->
  <rect x="1160" y="500" width="360" height="170" class="cloud"/>
  <text x="1340" y="537" text-anchor="middle" class="nodeTitle">OpenAI API</text>
  <rect x="1210" y="585" width="260" height="54" class="service"/>
  <text x="1340" y="618" text-anchor="middle" class="label">Chat / Vision model</text>

  <!-- rembg -->
  <rect x="620" y="650" width="360" height="170" class="node"/>
  <text x="800" y="687" text-anchor="middle" class="nodeTitle">Servicio rembg</text>
  <rect x="665" y="735" width="270" height="54" class="service"/>
  <text x="800" y="768" text-anchor="middle" class="label">FastAPI + rembg models</text>

  <!-- Lines -->
  <line x1="260" y1="600" x2="260" y2="260" class="line" marker-end="url(#arrow)"/>
  <text x="278" y="452" class="small">entrega app</text>

  <line x1="395" y1="232" x2="665" y2="397" class="line" marker-end="url(#arrow)"/>
  <text x="485" y="292" class="small">HTTPS</text>

  <line x1="395" y1="317" x2="665" y2="420" class="line" marker-end="url(#arrow)"/>
  <text x="500" y="388" class="small">HTTPS</text>

  <polyline points="395,232 1085,232 1210,360" class="line" marker-end="url(#arrow)"/>
  <text x="560" y="222" class="small">sesión / JWT</text>

  <polyline points="395,317 1070,317 1210,374" class="line" marker-end="url(#arrow)"/>
  <text x="560" y="342" class="small">sesión / JWT</text>

  <line x1="935" y1="395" x2="1210" y2="225" class="line" marker-end="url(#arrow)"/>
  <text x="1020" y="278" class="small">consultas</text>

  <line x1="935" y1="410" x2="1210" y2="298" class="line" marker-end="url(#arrow)"/>
  <text x="1030" y="348" class="small">imágenes</text>

  <line x1="935" y1="425" x2="1210" y2="605" class="line" marker-end="url(#arrow)"/>
  <text x="1000" y="550" class="small">análisis / recomendación</text>

  <line x1="800" y1="439" x2="800" y2="735" class="line" marker-end="url(#arrow)"/>
  <text x="818" y="590" class="small">remove-bg</text>
</svg>

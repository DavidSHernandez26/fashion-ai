<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .title{font:700 28px Arial, sans-serif;fill:#1f2937}
      .label{font:16px Arial, sans-serif;fill:#111827}
      .small{font:14px Arial, sans-serif;fill:#374151}
      .actor{stroke:#111827;stroke-width:2;fill:none}
      .box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:14}
      .use{fill:#ffffff;stroke:#2563eb;stroke-width:2}
      .line{stroke:#374151;stroke-width:2;fill:none}
      .dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:8 6}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="700" y="42" text-anchor="middle" class="title">Diagrama de casos de uso - Be: Confident</text>
  <rect x="250" y="80" width="880" height="760" class="box"/>
  <text x="690" y="112" text-anchor="middle" class="title" style="font-size:22px">Be: Confident</text>

  <!-- Actors -->
  <circle cx="90" cy="150" r="18" class="actor"/>
  <line x1="90" y1="168" x2="90" y2="225" class="actor"/>
  <line x1="55" y1="190" x2="125" y2="190" class="actor"/>
  <line x1="90" y1="225" x2="58" y2="270" class="actor"/>
  <line x1="90" y1="225" x2="122" y2="270" class="actor"/>
  <text x="90" y="305" text-anchor="middle" class="label">Usuario</text>

  <circle cx="90" cy="650" r="18" class="actor"/>
  <line x1="90" y1="668" x2="90" y2="725" class="actor"/>
  <line x1="55" y1="690" x2="125" y2="690" class="actor"/>
  <line x1="90" y1="725" x2="58" y2="770" class="actor"/>
  <line x1="90" y1="725" x2="122" y2="770" class="actor"/>
  <text x="90" y="805" text-anchor="middle" class="label">Usuario amigo</text>

  <circle cx="1285" cy="220" r="18" class="actor"/>
  <line x1="1285" y1="238" x2="1285" y2="295" class="actor"/>
  <line x1="1250" y1="260" x2="1320" y2="260" class="actor"/>
  <line x1="1285" y1="295" x2="1253" y2="340" class="actor"/>
  <line x1="1285" y1="295" x2="1317" y2="340" class="actor"/>
  <text x="1285" y="375" text-anchor="middle" class="label">Servicio IA OpenAI</text>

  <circle cx="1285" cy="510" r="18" class="actor"/>
  <line x1="1285" y1="528" x2="1285" y2="585" class="actor"/>
  <line x1="1250" y1="550" x2="1320" y2="550" class="actor"/>
  <line x1="1285" y1="585" x2="1253" y2="630" class="actor"/>
  <line x1="1285" y1="585" x2="1317" y2="630" class="actor"/>
  <text x="1285" y="665" text-anchor="middle" class="label">Clima / Geolocalización</text>

  <circle cx="1285" cy="735" r="18" class="actor"/>
  <line x1="1285" y1="753" x2="1285" y2="805" class="actor"/>
  <line x1="1250" y1="775" x2="1320" y2="775" class="actor"/>
  <line x1="1285" y1="805" x2="1253" y2="845" class="actor"/>
  <line x1="1285" y1="805" x2="1317" y2="845" class="actor"/>
  <text x="1285" y="875" text-anchor="middle" class="label">Servicio rembg</text>

  <!-- Use cases -->
  <ellipse cx="430" cy="160" rx="130" ry="34" class="use"/><text x="430" y="166" text-anchor="middle" class="label">Iniciar sesión</text>
  <ellipse cx="430" cy="240" rx="130" ry="34" class="use"/><text x="430" y="246" text-anchor="middle" class="label">Completar perfil</text>
  <ellipse cx="430" cy="330" rx="150" ry="34" class="use"/><text x="430" y="336" text-anchor="middle" class="label">Subir prenda/outfit</text>
  <ellipse cx="760" cy="285" rx="155" ry="34" class="use"/><text x="760" y="291" text-anchor="middle" class="label">Analizar imagen con IA</text>
  <ellipse cx="760" cy="375" rx="125" ry="34" class="use"/><text x="760" y="381" text-anchor="middle" class="label">Remover fondo</text>
  <ellipse cx="430" cy="430" rx="130" ry="34" class="use"/><text x="430" y="436" text-anchor="middle" class="label">Consultar closet</text>
  <ellipse cx="455" cy="530" rx="190" ry="34" class="use"/><text x="455" y="536" text-anchor="middle" class="label">Solicitar outfit al asistente</text>
  <ellipse cx="780" cy="495" rx="125" ry="34" class="use"/><text x="780" y="501" text-anchor="middle" class="label">Consultar clima</text>
  <ellipse cx="805" cy="585" rx="190" ry="34" class="use"/><text x="805" y="591" text-anchor="middle" class="label">Generar recomendación de outfit</text>
  <ellipse cx="460" cy="635" rx="180" ry="34" class="use"/><text x="460" y="641" text-anchor="middle" class="label">Guardar outfit en calendario</text>
  <ellipse cx="450" cy="715" rx="130" ry="34" class="use"/><text x="450" y="721" text-anchor="middle" class="label">Publicar outfit</text>
  <ellipse cx="790" cy="700" rx="175" ry="34" class="use"/><text x="790" y="706" text-anchor="middle" class="label">Dar like/comentar/guardar</text>
  <ellipse cx="790" cy="775" rx="230" ry="34" class="use"/><text x="790" y="781" text-anchor="middle" class="label">Buscar usuarios y gestionar amistades</text>
  <ellipse cx="455" cy="805" rx="155" ry="34" class="use"/><text x="455" y="811" text-anchor="middle" class="label">Ver closet autorizado</text>

  <!-- Actor links -->
  <line x1="130" y1="155" x2="300" y2="160" class="line"/>
  <line x1="132" y1="180" x2="300" y2="235" class="line"/>
  <line x1="132" y1="210" x2="285" y2="320" class="line"/>
  <line x1="132" y1="245" x2="303" y2="420" class="line"/>
  <line x1="132" y1="275" x2="285" y2="515" class="line"/>
  <line x1="132" y1="760" x2="300" y2="802" class="line"/>
  <line x1="1120" y1="285" x2="915" y2="285" class="line"/>
  <line x1="1120" y1="310" x2="990" y2="580" class="line"/>
  <line x1="1120" y1="560" x2="905" y2="500" class="line"/>
  <line x1="1120" y1="775" x2="885" y2="380" class="line"/>

  <!-- Include links -->
  <line x1="580" y1="320" x2="610" y2="300" class="dash" marker-end="url(#arrow)"/>
  <text x="610" y="318" class="small">&lt;&lt;include&gt;&gt;</text>
  <line x1="580" y1="340" x2="635" y2="365" class="dash" marker-end="url(#arrow)"/>
  <text x="604" y="362" class="small">&lt;&lt;include&gt;&gt;</text>
  <line x1="645" y1="520" x2="655" y2="505" class="dash" marker-end="url(#arrow)"/>
  <text x="650" y="528" class="small">&lt;&lt;include&gt;&gt;</text>
  <line x1="640" y1="542" x2="650" y2="575" class="dash" marker-end="url(#arrow)"/>
  <text x="650" y="560" class="small">&lt;&lt;include&gt;&gt;</text>
</svg>

      .actor{stroke:#111827;stroke-width:2;fill:none}
      .label{font:17px Arial,sans-serif;fill:#111827}
      .small{font:14px Arial,sans-serif;fill:#475569}
      .line{stroke:#334155;stroke-width:2.3;fill:none}
      .bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5;rx:20}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>

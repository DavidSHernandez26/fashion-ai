  <rect x="965" y="270" width="240" height="80" class="cloud"/><text x="1085" y="318" text-anchor="middle" class="label">OpenAI API</text>
  <rect x="920" y="415" width="330" height="80" class="cloud"/><text x="1085" y="450" text-anchor="middle" class="label">Servicio de clima</text><text x="1085" y="475" text-anchor="middle" class="small">geolocalización</text>
  <rect x="965" y="560" width="240" height="80" class="cloud"/><text x="1085" y="608" text-anchor="middle" class="label">Servicio rembg</text>

  <line x1="185" y1="330" x2="470" y2="330" class="line" marker-end="url(#arrow)"/><text x="292" y="315" class="small">usa la aplicación</text>
  <line x1="770" y1="300" x2="965" y2="175" class="line" marker-end="url(#arrow)"/><text x="830" y="210" class="small">auth, datos, archivos</text>

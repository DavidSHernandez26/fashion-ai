<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="1000" viewBox="0 0 1550 1000">
  <defs>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#111827}.label{font:16px Arial,sans-serif;fill:#111827}.small{font:13px Arial,sans-serif;fill:#475569}
      .bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5;rx:20}.api{fill:#fff;stroke:#2563eb;stroke-width:2.5;rx:18}.comp{fill:#ecfeff;stroke:#0891b2;stroke-width:2;rx:10}.ext{fill:#eef2ff;stroke:#4f46e5;stroke-width:2;rx:14}.line{stroke:#334155;stroke-width:2.1;fill:none}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  </defs>
  <rect x="25" y="25" width="1500" height="950" class="bg"/>
  <text x="775" y="70" text-anchor="middle" class="title">Modelo C4 - Nivel 3: Componentes Backend</text>

  <rect x="250" y="120" width="850" height="760" class="api"/>
  <text x="675" y="160" text-anchor="middle" class="title" style="font-size:24px">API Express</text>

  <rect x="310" y="210" width="260" height="78" class="comp"/><text x="440" y="240" text-anchor="middle" class="label">requireAuth</text><text x="440" y="264" text-anchor="middle" class="small">valida JWT de Supabase</text>
  <rect x="650" y="210" width="260" height="78" class="comp"/><text x="780" y="240" text-anchor="middle" class="label">upload / multer</text><text x="780" y="264" text-anchor="middle" class="small">recibe imágenes</text>
  <rect x="650" y="335" width="260" height="78" class="comp"/><text x="780" y="365" text-anchor="middle" class="label">sharp</text><text x="780" y="389" text-anchor="middle" class="small">rota, redimensiona y comprime</text>
  <rect x="650" y="465" width="260" height="78" class="comp"/><text x="780" y="495" text-anchor="middle" class="label">removeBackground</text><text x="780" y="519" text-anchor="middle" class="small">consume FastAPI rembg</text>
  <rect x="650" y="595" width="260" height="86" class="comp"/><text x="780" y="625" text-anchor="middle" class="label">OpenAI prompts</text><text x="780" y="649" text-anchor="middle" class="small">análisis visual, outfits</text><text x="780" y="669" text-anchor="middle" class="small">y recomendaciones</text>
  <rect x="310" y="335" width="260" height="78" class="comp"/><text x="440" y="365" text-anchor="middle" class="label">Supabase client</text><text x="440" y="389" text-anchor="middle" class="small">persistencia y storage</text>
  <rect x="310" y="465" width="260" height="78" class="comp"/><text x="440" y="495" text-anchor="middle" class="label">aiLimiter</text><text x="440" y="519" text-anchor="middle" class="small">rate limit endpoints IA</text>
  <rect x="310" y="595" width="260" height="86" class="comp"/><text x="440" y="625" text-anchor="middle" class="label">cache prendas/usernames</text><text x="440" y="649" text-anchor="middle" class="small">reduce consultas repetidas</text>

  <rect x="55" y="220" width="150" height="70" class="ext"/><text x="130" y="262" text-anchor="middle" class="label">Frontend</text>
  <rect x="1210" y="260" width="220" height="78" class="ext"/><text x="1320" y="292" text-anchor="middle" class="label">Supabase</text><text x="1320" y="316" text-anchor="middle" class="small">SQL / storage / auth</text>
  <rect x="1210" y="555" width="220" height="78" class="ext"/><text x="1320" y="600" text-anchor="middle" class="label">OpenAI API</text>
  <rect x="1210" y="430" width="220" height="78" class="ext"/><text x="1320" y="475" text-anchor="middle" class="label">FastAPI rembg</text>

  <line x1="205" y1="255" x2="310" y2="250" class="line" marker-end="url(#arrow)"/><text x="210" y="235" class="small">peticiones con JWT</text>
  <line x1="570" y1="250" x2="650" y2="250" class="line" marker-end="url(#arrow)"/>
  <line x1="780" y1="288" x2="780" y2="335" class="line" marker-end="url(#arrow)"/>
  <line x1="780" y1="413" x2="780" y2="465" class="line" marker-end="url(#arrow)"/>
  <line x1="910" y1="504" x2="1210" y2="470" class="line" marker-end="url(#arrow)"/><text x="1010" y="470" class="small">HTTP multipart</text>
  <line x1="780" y1="413" x2="780" y2="595" class="line" marker-end="url(#arrow)"/>
  <line x1="910" y1="638" x2="1210" y2="594" class="line" marker-end="url(#arrow)"/>
  <line x1="440" y1="288" x2="440" y2="335" class="line" marker-end="url(#arrow)"/>
  <line x1="570" y1="374" x2="1210" y2="300" class="line" marker-end="url(#arrow)"/>
  <line x1="440" y1="288" x2="440" y2="465" class="line" marker-end="url(#arrow)"/>
  <line x1="440" y1="413" x2="440" y2="595" class="line" marker-end="url(#arrow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <style>
      .title{font:700 30px Arial, sans-serif;fill:#111827}
      .className{font:700 18px Arial, sans-serif;fill:#111827}
      .attr{font:15px Arial, sans-serif;fill:#1f2937}
      .box{fill:#ffffff;stroke:#2563eb;stroke-width:2;rx:8}
      .head{fill:#dbeafe;stroke:#2563eb;stroke-width:2}
      .line{stroke:#334155;stroke-width:2;fill:none}
      .card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1;rx:14}
      .mult{font:15px Arial, sans-serif;fill:#334155}
    </style>
  </defs>

  <rect x="25" y="25" width="1550" height="1000" class="card"/>
  <text x="800" y="70" text-anchor="middle" class="title">Diagrama de clases - Be: Confident</text>

  <!-- Usuario -->
  <rect x="80" y="150" width="250" height="120" class="box"/>
  <rect x="80" y="150" width="250" height="38" class="head"/>
  <text x="205" y="175" text-anchor="middle" class="className">Usuario</text>
  <text x="100" y="215" class="attr">id: uuid</text>
  <text x="100" y="242" class="attr">email: string</text>

  <!-- Perfil -->
  <rect x="430" y="120" width="300" height="210" class="box"/>
  <rect x="430" y="120" width="300" height="38" class="head"/>
  <text x="580" y="145" text-anchor="middle" class="className">Perfil</text>
  <text x="450" y="185" class="attr">id: uuid</text>
  <text x="450" y="212" class="attr">username: string</text>
  <text x="450" y="239" class="attr">nombre: string</text>
  <text x="450" y="266" class="attr">bio: string</text>
  <text x="450" y="293" class="attr">avatar_url: string</text>
  <text x="450" y="320" class="attr">setup_completo: boolean</text>

  <!-- Prenda -->
  <rect x="820" y="100" width="330" height="250" class="box"/>
  <rect x="820" y="100" width="330" height="38" class="head"/>
  <text x="985" y="125" text-anchor="middle" class="className">Prenda</text>
  <text x="840" y="165" class="attr">id: uuid</text>
  <text x="840" y="192" class="attr">usuario_id: uuid</text>
  <text x="840" y="219" class="attr">tipo: prenda|outfit</text>
  <text x="840" y="246" class="attr">genero: string</text>
  <text x="840" y="273" class="attr">imagen_url: string</text>
  <text x="840" y="300" class="attr">descripcion: string</text>
  <text x="840" y="327" class="attr">metadata_ia: json</text>

  <!-- Calendar -->
  <rect x="1230" y="115" width="300" height="220" class="box"/>
  <rect x="1230" y="115" width="300" height="38" class="head"/>
  <text x="1380" y="140" text-anchor="middle" class="className">CalendarOutfit</text>
  <text x="1250" y="180" class="attr">id: uuid</text>
  <text x="1250" y="207" class="attr">usuario_id: uuid</text>
  <text x="1250" y="234" class="attr">fecha: date</text>
  <text x="1250" y="261" class="attr">imagen_url: string</text>
  <text x="1250" y="288" class="attr">descripcion: string</text>
  <text x="1250" y="315" class="attr">metadata: json</text>

  <!-- Post -->
  <rect x="80" y="455" width="310" height="205" class="box"/>
  <rect x="80" y="455" width="310" height="38" class="head"/>
  <text x="235" y="480" text-anchor="middle" class="className">Post</text>
  <text x="100" y="520" class="attr">id: uuid</text>
  <text x="100" y="547" class="attr">usuario_id: uuid</text>
  <text x="100" y="574" class="attr">imagen_url: string</text>
  <text x="100" y="601" class="attr">descripcion: string</text>
  <text x="100" y="628" class="attr">prendas: json</text>

  <!-- Like -->
  <rect x="470" y="430" width="240" height="145" class="box"/>
  <rect x="470" y="430" width="240" height="38" class="head"/>
  <text x="590" y="455" text-anchor="middle" class="className">Like</text>
  <text x="490" y="495" class="attr">id: uuid</text>
  <text x="490" y="522" class="attr">post_id: uuid</text>
  <text x="490" y="549" class="attr">usuario_id: uuid</text>

  <!-- Comment -->
  <rect x="780" y="410" width="300" height="185" class="box"/>
  <rect x="780" y="410" width="300" height="38" class="head"/>
  <text x="930" y="435" text-anchor="middle" class="className">Comment</text>
  <text x="800" y="475" class="attr">id: uuid</text>
  <text x="800" y="502" class="attr">post_id: uuid</text>
  <text x="800" y="529" class="attr">usuario_id: uuid</text>
  <text x="800" y="556" class="attr">texto: string</text>
  <text x="800" y="583" class="attr">created_at: timestamp</text>

  <!-- Wishlist -->
  <rect x="1160" y="420" width="310" height="205" class="box"/>
  <rect x="1160" y="420" width="310" height="38" class="head"/>
  <text x="1315" y="445" text-anchor="middle" class="className">Wishlist</text>
  <text x="1180" y="485" class="attr">id: uuid</text>
  <text x="1180" y="512" class="attr">usuario_id: uuid</text>
  <text x="1180" y="539" class="attr">post_id: uuid</text>
  <text x="1180" y="566" class="attr">imagen_url: string</text>
  <text x="1180" y="593" class="attr">descripcion: string</text>

  <!-- Friendship -->
  <rect x="350" y="760" width="330" height="170" class="box"/>
  <rect x="350" y="760" width="330" height="38" class="head"/>
  <text x="515" y="785" text-anchor="middle" class="className">Friendship</text>
  <text x="370" y="825" class="attr">id: uuid</text>
  <text x="370" y="852" class="attr">requester_id: uuid</text>
  <text x="370" y="879" class="attr">addressee_id: uuid</text>
  <text x="370" y="906" class="attr">status: pending|accepted|rejected</text>

  <!-- Notification -->
  <rect x="850" y="735" width="330" height="220" class="box"/>
  <rect x="850" y="735" width="330" height="38" class="head"/>
  <text x="1015" y="760" text-anchor="middle" class="className">Notification</text>
  <text x="870" y="800" class="attr">id: uuid</text>
  <text x="870" y="827" class="attr">usuario_id: uuid</text>
  <text x="870" y="854" class="attr">from_user_id: uuid</text>
  <text x="870" y="881" class="attr">tipo: string</text>
  <text x="870" y="908" class="attr">mensaje: string</text>
  <text x="870" y="935" class="attr">leida: boolean</text>

  <!-- Relationships from Usuario -->
  <line x1="330" y1="205" x2="430" y2="205" class="line"/>
  <text x="340" y="195" class="mult">1</text><text x="407" y="195" class="mult">1</text>
  <line x1="330" y1="220" x2="820" y2="220" class="line"/>
  <text x="340" y="238" class="mult">1</text><text x="790" y="238" class="mult">*</text>
  <polyline points="205,270 205,385 1380,385 1380,335" class="line"/>
  <text x="215" y="292" class="mult">1</text><text x="1358" y="360" class="mult">*</text>
  <line x1="205" y1="270" x2="235" y2="455" class="line"/>
  <text x="188" y="292" class="mult">1</text><text x="244" y="445" class="mult">*</text>
  <polyline points="205,270 205,715 1315,715 1315,625" class="line"/>
  <text x="215" y="292" class="mult">1</text><text x="1292" y="650" class="mult">*</text>
  <polyline points="205,270 205,845 350,845" class="line"/>
  <text x="215" y="292" class="mult">1</text><text x="325" y="835" class="mult">*</text>
  <polyline points="205,270 205,985 1015,985 1015,955" class="line"/>
  <text x="215" y="292" class="mult">1</text><text x="993" y="974" class="mult">*</text>

  <!-- Post relationships -->
  <line x1="390" y1="500" x2="470" y2="500" class="line"/>
  <text x="402" y="490" class="mult">1</text><text x="450" y="490" class="mult">*</text>
  <line x1="390" y1="565" x2="780" y2="520" class="line"/>
  <text x="402" y="555" class="mult">1</text><text x="755" y="515" class="mult">*</text>
  <line x1="390" y1="620" x2="1160" y2="540" class="line"/>
  <text x="402" y="610" class="mult">1</text><text x="1135" y="540" class="mult">*</text>
</svg>

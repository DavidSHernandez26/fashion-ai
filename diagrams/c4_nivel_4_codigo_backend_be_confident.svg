<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1150" viewBox="0 0 1700 1150">
  <defs>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#111827}
      .h{font:700 16px Arial,sans-serif;fill:#111827}
      .t{font:14px Arial,sans-serif;fill:#1f2937}
      .s{font:13px Arial,sans-serif;fill:#475569}
      .bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5;rx:20}
      .module{fill:#fff;stroke:#2563eb;stroke-width:2;rx:10}
      .route{fill:#ecfeff;stroke:#0891b2;stroke-width:2;rx:10}
      .helper{fill:#f0fdf4;stroke:#16a34a;stroke-width:2;rx:10}
      .ext{fill:#eef2ff;stroke:#4f46e5;stroke-width:2;rx:14}
      .db{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:14}
      .line{stroke:#334155;stroke-width:2;fill:none}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="25" y="25" width="1650" height="1100" class="bg"/>
  <text x="850" y="70" text-anchor="middle" class="title">Modelo C4 - Nivel 4: Código Backend Express</text>

  <rect x="700" y="115" width="300" height="120" class="module"/>
  <text x="850" y="145" text-anchor="middle" class="h">server.js</text>
  <text x="725" y="175" class="t">app: Express</text>
  <text x="725" y="198" class="t">MODEL: gpt-4o-mini</text>
  <text x="725" y="221" class="t">aiLimiter / multer / CORS</text>

  <!-- Routes -->
  <rect x="90" y="330" width="300" height="125" class="route"/>
  <text x="240" y="360" text-anchor="middle" class="h">POST /api/subir-prenda</text>
  <text x="115" y="390" class="t">procesa prenda/outfit</text>
  <text x="115" y="413" class="t">Storage + tabla prendas</text>
  <text x="115" y="436" class="t">OpenAI Vision + rembg</text>

  <rect x="450" y="330" width="300" height="125" class="route"/>
  <text x="600" y="360" text-anchor="middle" class="h">POST /api/fashion</text>
  <text x="475" y="390" class="t">carga closet/perfil/calendario</text>
  <text x="475" y="413" class="t">construye prompt</text>
  <text x="475" y="436" class="t">retorna outfit recomendado</text>

  <rect x="810" y="330" width="300" height="125" class="route"/>
  <text x="960" y="360" text-anchor="middle" class="h">GET/POST /api/calendario</text>
  <text x="835" y="390" class="t">consulta calendar_outfits</text>
  <text x="835" y="413" class="t">upsert por usuario/fecha</text>
  <text x="835" y="436" class="t">elimina registros propios</text>

  <rect x="1170" y="330" width="300" height="125" class="route"/>
  <text x="1320" y="360" text-anchor="middle" class="h">Feed / Social</text>
  <text x="1195" y="390" class="t">posts, feed, likes</text>
  <text x="1195" y="413" class="t">comments, wishlist</text>
  <text x="1195" y="436" class="t">notificaciones sociales</text>

  <rect x="1170" y="515" width="300" height="125" class="route"/>
  <text x="1320" y="545" text-anchor="middle" class="h">Perfil / Amistades</text>
  <text x="1195" y="575" class="t">profiles</text>
  <text x="1195" y="598" class="t">friendships</text>
  <text x="1195" y="621" class="t">notifications</text>

  <!-- Middleware/helpers -->
  <rect x="90" y="710" width="260" height="105" class="helper"/>
  <text x="220" y="740" text-anchor="middle" class="h">requireAuth</text>
  <text x="115" y="770" class="t">valida JWT Supabase</text>
  <text x="115" y="793" class="t">asigna req.userId</text>

  <rect x="395" y="710" width="260" height="105" class="helper"/>
  <text x="525" y="740" text-anchor="middle" class="h">safeParseJSON</text>
  <text x="420" y="770" class="t">extrae bloque JSON</text>
  <text x="420" y="793" class="t">retorna objeto o null</text>

  <rect x="700" y="710" width="260" height="105" class="helper"/>
  <text x="830" y="740" text-anchor="middle" class="h">removeBackground</text>
  <text x="725" y="770" class="t">resize con sharp</text>
  <text x="725" y="793" class="t">consume REMBG_SERVICE_URL</text>

  <rect x="1005" y="710" width="260" height="105" class="helper"/>
  <text x="1135" y="740" text-anchor="middle" class="h">Cache prendas/usernames</text>
  <text x="1030" y="770" class="t">Map con TTL</text>
  <text x="1030" y="793" class="t">reduce consultas repetidas</text>

  <rect x="1310" y="710" width="260" height="105" class="helper"/>
  <text x="1440" y="740" text-anchor="middle" class="h">crearNotificacion</text>
  <text x="1335" y="770" class="t">inserta notifications</text>
  <text x="1335" y="793" class="t">evita self-notification</text>

  <rect x="395" y="870" width="260" height="105" class="helper"/>
  <text x="525" y="900" text-anchor="middle" class="h">generarContextoClima</text>
  <text x="420" y="930" class="t">reglas por temperatura</text>
  <text x="420" y="953" class="t">lluvia y viento</text>

  <rect x="700" y="870" width="260" height="105" class="helper"/>
  <text x="830" y="900" text-anchor="middle" class="h">formatPrendaRica</text>
  <text x="725" y="930" class="t">metadata a contexto IA</text>
  <text x="725" y="953" class="t">material, fit, patrón</text>

  <rect x="1005" y="870" width="260" height="105" class="helper"/>
  <text x="1135" y="900" text-anchor="middle" class="h">deduplicarPorTipo</text>
  <text x="1030" y="930" class="t">evita tipos repetidos</text>
  <text x="1030" y="953" class="t">controla accesorios</text>

  <!-- External -->
  <rect x="90" y="1000" width="250" height="75" class="db"/>
  <text x="215" y="1045" text-anchor="middle" class="h">Supabase</text>
  <rect x="670" y="1000" width="250" height="75" class="ext"/>
  <text x="795" y="1045" text-anchor="middle" class="h">OpenAI API</text>
  <rect x="1240" y="1000" width="250" height="75" class="ext"/>
  <text x="1365" y="1045" text-anchor="middle" class="h">FastAPI rembg</text>

  <!-- Connections from server -->
  <line x1="760" y1="235" x2="240" y2="330" class="line" marker-end="url(#arrow)"/>
  <line x1="815" y1="235" x2="600" y2="330" class="line" marker-end="url(#arrow)"/>
  <line x1="885" y1="235" x2="960" y2="330" class="line" marker-end="url(#arrow)"/>
  <line x1="945" y1="235" x2="1320" y2="330" class="line" marker-end="url(#arrow)"/>

  <!-- Route to helpers -->
  <line x1="240" y1="455" x2="220" y2="710" class="line" marker-end="url(#arrow)"/>
  <line x1="240" y1="455" x2="525" y2="710" class="line" marker-end="url(#arrow)"/>
  <line x1="240" y1="455" x2="830" y2="710" class="line" marker-end="url(#arrow)"/>
  <line x1="600" y1="455" x2="525" y2="710" class="line" marker-end="url(#arrow)"/>
  <line x1="600" y1="455" x2="1135" y2="710" class="line" marker-end="url(#arrow)"/>
  <line x1="600" y1="455" x2="525" y2="870" class="line" marker-end="url(#arrow)"/>
  <line x1="600" y1="455" x2="830" y2="870" class="line" marker-end="url(#arrow)"/>
  <line x1="600" y1="455" x2="1135" y2="870" class="line" marker-end="url(#arrow)"/>
  <line x1="1320" y1="455" x2="1440" y2="710" class="line" marker-end="url(#arrow)"/>
  <line x1="1320" y1="640" x2="1440" y2="710" class="line" marker-end="url(#arrow)"/>

  <!-- External links -->
  <line x1="220" y1="815" x2="215" y2="1000" class="line" marker-end="url(#arrow)"/>
  <line x1="1135" y1="815" x2="215" y2="1000" class="line" marker-end="url(#arrow)"/>
  <line x1="525" y1="815" x2="795" y2="1000" class="line" marker-end="url(#arrow)"/>
  <line x1="830" y1="815" x2="1365" y2="1000" class="line" marker-end="url(#arrow)"/>
</svg>

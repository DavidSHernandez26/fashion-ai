<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1600" viewBox="0 0 1100 1600">
  <defs>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#111827}.txt{font:15px Arial,sans-serif;fill:#111827}.small{font:13px Arial,sans-serif;fill:#475569}
      .bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5;rx:20}.act{fill:#ecfeff;stroke:#0891b2;stroke-width:2;rx:18}.decision{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.term{fill:#111827;stroke:#111827;stroke-width:2}.line{stroke:#334155;stroke-width:2;fill:none}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  </defs>
  <rect x="25" y="25" width="1050" height="1550" class="bg"/>
  <text x="550" y="70" text-anchor="middle" class="title">4.1.3 Diagrama de actividades - Subida y análisis</text>

  <circle cx="550" cy="115" r="18" class="term"/>
  <rect x="365" y="160" width="370" height="44" class="act"/><text x="550" y="188" text-anchor="middle" class="txt">Usuario abre modal de subida</text>
  <rect x="365" y="230" width="370" height="44" class="act"/><text x="550" y="258" text-anchor="middle" class="txt">Selecciona prenda u outfit</text>
  <rect x="365" y="300" width="370" height="44" class="act"/><text x="550" y="328" text-anchor="middle" class="txt">Elige imagen desde cámara o galería</text>
  <rect x="365" y="370" width="370" height="44" class="act"/><text x="550" y="398" text-anchor="middle" class="txt">Frontend comprime imagen</text>
  <rect x="365" y="440" width="370" height="44" class="act"/><text x="550" y="468" text-anchor="middle" class="txt">Obtiene JWT de Supabase</text>
  <rect x="365" y="510" width="370" height="44" class="act"/><text x="550" y="538" text-anchor="middle" class="txt">Envía FormData al backend</text>

  <polygon points="550,590 685,660 550,730 415,660" class="decision"/>
  <text x="550" y="657" text-anchor="middle" class="txt">¿JWT válido?</text>

  <rect x="65" y="635" width="260" height="50" class="act"/><text x="195" y="666" text-anchor="middle" class="txt">Responde 401</text>
  <rect x="65" y="710" width="260" height="50" class="act"/><text x="195" y="741" text-anchor="middle" class="txt">Muestra error de sesión</text>

  <rect x="365" y="770" width="370" height="44" class="act"/><text x="550" y="798" text-anchor="middle" class="txt">Multer recibe archivo</text>
  <rect x="365" y="840" width="370" height="44" class="act"/><text x="550" y="868" text-anchor="middle" class="txt">Sharp rota y optimiza imagen</text>

  <polygon points="550,920 685,990 550,1060 415,990" class="decision"/>
  <text x="550" y="987" text-anchor="middle" class="txt">¿Tipo = prenda?</text>

  <rect x="135" y="1100" width="330" height="50" class="act"/><text x="300" y="1131" text-anchor="middle" class="txt">Solicita remoción de fondo</text>
  <rect x="135" y="1175" width="330" height="50" class="act"/><text x="300" y="1206" text-anchor="middle" class="txt">Sube imagen a Storage</text>
  <rect x="135" y="1250" width="330" height="50" class="act"/><text x="300" y="1281" text-anchor="middle" class="txt">OpenAI analiza la prenda</text>
  <polygon points="300,1325 430,1390 300,1455 170,1390" class="decision"/>
  <text x="300" y="1387" text-anchor="middle" class="txt">¿Prenda válida?</text>
  <rect x="90" y="1480" width="260" height="50" class="act"/><text x="220" y="1511" text-anchor="middle" class="txt">Inserta en prendas</text>
  <rect x="385" y="1480" width="260" height="50" class="act"/><text x="515" y="1511" text-anchor="middle" class="txt">Responde error 422</text>

  <rect x="655" y="1100" width="330" height="50" class="act"/><text x="820" y="1131" text-anchor="middle" class="txt">Sube outfit a Storage</text>
  <rect x="655" y="1175" width="330" height="50" class="act"/><text x="820" y="1206" text-anchor="middle" class="txt">OpenAI detecta prendas</text>
  <rect x="655" y="1250" width="330" height="50" class="act"/><text x="820" y="1281" text-anchor="middle" class="txt">Inserta outfit en prendas</text>

  <rect x="430" y="1540" width="300" height="44" class="act"/><text x="580" y="1568" text-anchor="middle" class="txt">Frontend refresca closet</text>

  <line x1="550" y1="133" x2="550" y2="160" class="line" marker-end="url(#arrow)"/>
  <line x1="550" y1="204" x2="550" y2="230" class="line" marker-end="url(#arrow)"/>
  <line x1="550" y1="274" x2="550" y2="300" class="line" marker-end="url(#arrow)"/>
  <line x1="550" y1="344" x2="550" y2="370" class="line" marker-end="url(#arrow)"/>
  <line x1="550" y1="414" x2="550" y2="440" class="line" marker-end="url(#arrow)"/>
  <line x1="550" y1="484" x2="550" y2="510" class="line" marker-end="url(#arrow)"/>
  <line x1="550" y1="554" x2="550" y2="590" class="line" marker-end="url(#arrow)"/>
  <line x1="415" y1="660" x2="325" y2="660" class="line" marker-end="url(#arrow)"/><text x="355" y="645" class="small">No</text>
  <line x1="195" y1="685" x2="195" y2="710" class="line" marker-end="url(#arrow)"/>
  <line x1="550" y1="730" x2="550" y2="770" class="line" marker-end="url(#arrow)"/><text x="570" y="755" class="small">Sí</text>
  <line x1="550" y1="814" x2="550" y2="840" class="line" marker-end="url(#arrow)"/>
  <line x1="550" y1="884" x2="550" y2="920" class="line" marker-end="url(#arrow)"/>
  <line x1="415" y1="990" x2="300" y2="1100" class="line" marker-end="url(#arrow)"/><text x="360" y="1025" class="small">Sí</text>
  <line x1="685" y1="990" x2="820" y2="1100" class="line" marker-end="url(#arrow)"/><text x="730" y="1025" class="small">No, outfit</text>
  <line x1="300" y1="1150" x2="300" y2="1175" class="line" marker-end="url(#arrow)"/>
  <line x1="300" y1="1225" x2="300" y2="1250" class="line" marker-end="url(#arrow)"/>
  <line x1="300" y1="1300" x2="300" y2="1325" class="line" marker-end="url(#arrow)"/>
  <line x1="300" y1="1455" x2="220" y2="1480" class="line" marker-end="url(#arrow)"/><text x="245" y="1465" class="small">Sí</text>
  <line x1="430" y1="1390" x2="515" y2="1480" class="line" marker-end="url(#arrow)"/><text x="460" y="1430" class="small">No</text>
  <line x1="820" y1="1150" x2="820" y2="1175" class="line" marker-end="url(#arrow)"/>
  <line x1="820" y1="1225" x2="820" y2="1250" class="line" marker-end="url(#arrow)"/>
  <line x1="820" y1="1300" x2="650" y2="1540" class="line" marker-end="url(#arrow)"/>
  <line x1="220" y1="1530" x2="430" y2="1555" class="line" marker-end="url(#arrow)"/>
</svg>
